<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tripster Traveler Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-dark": "#0a0f14",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100dvh;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .glass-container {
            background: rgba(16, 25, 34, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white antialiased selection:bg-primary/30">
<div class="relative min-h-screen flex flex-col w-full overflow-x-hidden">
<div class="fixed inset-0 w-full h-full z-0">
<div class="absolute inset-0 bg-gradient-to-b from-black/80 via-black/60 to-background-dark z-10"></div>
<div class="w-full h-full bg-center bg-no-repeat bg-cover" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDh0bSL1iVgeARM6qePfOIh0hNQRBjVRhIPpevXbbzfQkiYtHKFnvj4bqYBhCjqC4YPjQF1OOQLd8Zwgp8S0Ml7e9L2livihz4sljgWGac1i7jUwyDxgzQtoupGgBeXaKpIE6qdEwCLnknvm5q9z-LKbKbi54elDt61QZPnA8FNgwDJKmcYrvJRmd0xBbkklBXRu5K1r0C08fk3Om9Mwe6bzDmz46BTInucSc-JeS1I6h4iFiSYKfizSZvRKw9w-8T9L09x0zAVC5o");'></div>
</div>
<div class="relative z-20 flex flex-col min-h-screen">
<div class="w-full p-6 flex justify-center items-start">
<div class="flex items-center gap-3 text-white">
<div class="p-2 bg-white/10 backdrop-blur-md rounded-xl border border-white/20">
<span class="material-symbols-outlined text-3xl">flight_takeoff</span>
</div>
<div class="flex flex-col">
<span class="text-2xl font-bold tracking-tight leading-none text-white">Tripster</span>
<span class="text-[10px] font-bold tracking-[0.2em] uppercase text-white/70 mt-0.5">Travel Smarter</span>
</div>
</div>
</div>
<div class="flex-1 glass-container border-t border-white/10 rounded-t-3xl shadow-2xl px-6 pt-8 pb-12 flex flex-col items-center w-full max-w-lg mx-auto">
<div class="w-12 h-1.5 bg-white/10 rounded-full mb-6"></div>
<h1 class="text-white tracking-tight text-[28px] font-bold leading-tight text-center mb-2">
                    Create Account
                </h1>
<p class="text-slate-400 text-sm mb-6 text-center">
                    Sign up as a traveler to discover and book trips.
                </p>
<div class="w-full mb-6">
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-white/5 border border-white/10 p-1">
<label class="flex cursor-pointer h-full flex-1 items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white/10 has-[:checked]:text-primary transition-all duration-200 text-slate-400 text-sm font-semibold leading-normal group">
<span class="truncate">Traveler</span>
<input checked="" class="invisible w-0" name="role_selector" type="radio" value="Traveler"/>
</label>
<label class="flex cursor-pointer h-full flex-1 items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white/10 has-[:checked]:text-primary transition-all duration-200 text-slate-400 text-sm font-semibold leading-normal group">
<span class="truncate">Agency</span>
<input class="invisible w-0" name="role_selector" type="radio" value="Agency"/>
</label>
</div>
</div>
<form class="w-full flex flex-col gap-4">
<label class="flex flex-col w-full">
<span class="text-white text-xs font-medium leading-normal pb-1.5 ml-1 uppercase tracking-wider opacity-70">Full Name</span>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-white border border-white/20 bg-white/5 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base placeholder:text-white/20 transition-colors" placeholder="e.g. John Doe" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-white/30">person</span>
</div>
</label>
<label class="flex flex-col w-full">
<span class="text-white text-xs font-medium leading-normal pb-1.5 ml-1 uppercase tracking-wider opacity-70">Email Address</span>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-white border border-white/20 bg-white/5 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base placeholder:text-white/20 transition-colors" placeholder="name@example.com" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-white/30">mail</span>
</div>
</label>
<div class="flex flex-col sm:flex-row gap-4 w-full">
<label class="flex flex-col w-full">
<span class="text-white text-xs font-medium leading-normal pb-1.5 ml-1 uppercase tracking-wider opacity-70">City</span>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-white border border-white/20 bg-white/5 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base placeholder:text-white/20 transition-colors" placeholder="Your City" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-white/30">location_on</span>
</div>
</label>
<label class="flex flex-col w-full">
<span class="text-white text-xs font-medium leading-normal pb-1.5 ml-1 uppercase tracking-wider opacity-70">CNIC</span>
<div class="relative">
<input class="form-input flex w-full rounded-xl text-white border border-white/20 bg-white/5 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-base placeholder:text-white/20 transition-colors" placeholder="xxxxx-xxxxxxx-x" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-white/30">badge</span>
</div>
</label>
</div>
<label class="flex flex-col w-full">
<span class="text-white text-xs font-medium leading-normal pb-1.5 ml-1 uppercase tracking-wider opacity-70">Password</span>
<div class="relative flex w-full items-stretch">
<input class="form-input flex w-full rounded-l-xl border border-r-0 border-white/20 bg-white/5 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-white placeholder:text-white/20 text-base" placeholder="Create a password" type="password"/>
<div class="flex items-center justify-center px-4 border border-l-0 border-white/20 bg-white/5 rounded-r-xl cursor-pointer hover:bg-white/10 transition-colors text-white/30">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</div>
</div>
</label>
<label class="flex flex-col w-full">
<span class="text-white text-xs font-medium leading-normal pb-1.5 ml-1 uppercase tracking-wider opacity-70">Confirm Password</span>
<div class="relative flex w-full items-stretch">
<input class="form-input flex w-full rounded-l-xl border border-r-0 border-white/20 bg-white/5 focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 text-white placeholder:text-white/20 text-base" placeholder="Confirm password" type="password"/>
<div class="flex items-center justify-center px-4 border border-l-0 border-white/20 bg-white/5 rounded-r-xl cursor-pointer hover:bg-white/10 transition-colors text-white/30">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</div>
</div>
</label>
<label class="flex items-center gap-3 mt-1 ml-1 cursor-pointer">
<input class="form-checkbox w-5 h-5 text-primary rounded border-white/20 focus:ring-primary bg-white/5" type="checkbox"/>
<span class="text-sm text-slate-400 select-none">I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms &amp; Conditions</a></span>
</label>
<button class="mt-4 w-full h-12 bg-primary hover:bg-blue-600 active:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transition-all duration-200 flex items-center justify-center gap-2" type="button">
                        Create Account
                    </button>
</form>
<div class="relative w-full my-8 text-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/10"></div>
</div>
<span class="relative bg-background-dark/50 px-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Or sign up with</span>
</div>
<div class="flex gap-4 w-full">
<button class="flex-1 h-12 flex items-center justify-center gap-2 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-colors text-white font-medium text-sm">
<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M23.7663 12.2764C23.7663 11.4607 23.6999 10.6406 23.5588 9.83807H12.2402V14.4591H18.722C18.4528 15.9494 17.5887 17.2678 16.3233 18.1056V21.1039H20.1903C22.4611 19.0139 23.7663 15.9274 23.7663 12.2764Z" fill="#4285F4"></path>
<path d="M12.2401 24.0008C15.4765 24.0008 18.2059 22.9382 20.1945 21.1039L16.3275 18.1055C15.2517 18.8375 13.8627 19.252 12.2445 19.252C9.11391 19.252 6.45949 17.1399 5.50708 14.3003H1.5166V17.3912C3.55374 21.4434 7.70293 24.0008 12.2401 24.0008Z" fill="#34A853"></path>
<path d="M5.50277 14.3003C4.99952 12.8099 4.99952 11.1961 5.50277 9.70575V6.61481H1.51674C-0.185512 10.0056 -0.185512 14.0004 1.51674 17.3912L5.50277 14.3003Z" fill="#FBBC05"></path>
<path d="M12.2401 4.74966C13.9509 4.7232 15.6044 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.0344664 12.2401 0.000808666C7.70293 0.000808666 3.55374 2.55822 1.5166 6.61481L5.50264 9.70575C6.45064 6.86173 9.10947 4.74966 12.2401 4.74966Z" fill="#EA4335"></path>
</svg>
                        Google
                    </button>
<button class="flex-1 h-12 flex items-center justify-center gap-2 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 transition-colors text-white font-medium text-sm">
<svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-.68-.32-1.39-.32-2.08 0-1.03.48-2.1.55-3.07-.4-4.15-4.08-3.5-11.2 1.48-11.45 1.25-.06 2.14.65 2.82.63.78-.02 2.14-0.89 3.6-0.65 1.53.25 2.68 1.01 3.42 2.12-2.95 1.83-2.45 6.09.52 7.37-.66 1.34-1.54 2.66-2.61 3.73v.25ZM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.17 2.37-1.92 4.22-3.74 4.25Z"></path>
</svg>
                        Apple
                    </button>
</div>
<div class="mt-8 mb-4 text-center">
<p class="text-slate-400 text-sm">
                        Already have an account? 
                        <a class="text-primary font-bold hover:underline ml-1" href="#">Log In</a>
</p>
</div>
</div>
</div>
</div>

</body></html>
